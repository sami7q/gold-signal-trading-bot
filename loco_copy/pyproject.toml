[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loco-copy"
version = "0.1.0"
description = "Copy Loco's Hyperliquid perp trades to one exchange account (paper -> Bybit demo -> Bybit live)."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "pydantic-settings>=2.4",
    "structlog>=24",
    "keyring>=25",
    "pybit>=5.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
loco-copy = "loco_copy.cli:main"

[tool.setuptools.packages.find]
include = ["loco_copy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["demo: contract tests against Bybit demo (skipped unless demo keys are in the keyring)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "PLC0415", "SLF001"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC0415", "SLF001"]
"tools/*" = ["PLC0415"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
packages = ["loco_copy"]
